name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: ScreenTimeCore (swift build + test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-parent
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  config-templates:
    name: Config templates compile standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the parent and child Config templates
        run: |
          xcrun swiftc -typecheck ios-parent/ScreenTimeParent/App/Config-Template.swift
          xcrun swiftc -typecheck ios-child/ScreenTimeChild/App/Config-Template.swift
